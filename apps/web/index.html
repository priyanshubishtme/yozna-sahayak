<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('yojana_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = saved === 'dark' || (saved === 'system' && prefersDark) || (!saved && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YojanaSahayak" />
    <title>योजना सहायक | Yojana Sahayak — Civic Scheme Discovery & Eligibility</title>
    <meta name="description" content="AI-assisted, evidence-grounded government scheme discovery and deterministic eligibility platform for Indian citizens in Hindi and English." />
