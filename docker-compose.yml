version: '3.8'

services:
  yojana-sahayak:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yojana-sahayak-prod
    ports:
      - "8005:8005"
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8005
      - DATABASE_URL=sqlite+aiosqlite:///data/yojana_sahayak.db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - JWT_SECRET=${JWT_SECRET:-yojana-production-secret-change-me}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-yojana-admin-master-2026}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
