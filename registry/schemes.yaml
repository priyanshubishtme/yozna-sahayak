# Initial 13 Scheme Seed Catalogue
# Defines scheme identity, jurisdiction, category, initial mode, and rule scope per Blueprint Section 3.1.

schemes:
  - scheme_id: "SCHEME-PM-KISAN"
    code: "pm_kisan"
    name_en: "Pradhan Mantri Kisan Samman Nidhi (PM-KISAN)"
    name_hi: "प्रधानमंत्री किसान सम्मान निधि (पीएम-किसान)"
    short_name: "PM-KISAN"
    level: "central"
    ministry_or_dept: "Ministry of Agriculture & Farmers Welfare"
    category: "Agriculture & Rural"
    description_en: "Central sector scheme providing income support of Rs. 6,000 per year in three equal installments to landholding farmer families across India."
    description_hi: "भूमिधारक किसान परिवारों को प्रति वर्ष 6,000 रुपये की आय सहायता तीन समान किस्तों में प्रदान करने वाली केंद्रीय क्षेत्र योजना।"
    initial_mode: "rag_and_rules"
    rule_scope: "candidate_rule_enabled"
    rag_enabled: true
    rules_enabled: true
    official_portal_url: "https://pmkisan.gov.in"
    benefits_summary_en: "Rs. 6,000 per year directly into bank account via DBT in 3 tranches of Rs. 2,000 each."
    benefits_summary_hi: "डीबीटी के माध्यम से बैंक खाते में प्रति वर्ष 6,000 रुपये (2,000 रुपये की 3 किस्तों में)।"

  - scheme_id: "SCHEME-PMFBY"
    code: "pmfby"
    name_en: "Pradhan Mantri Fasal Bima Yojana (PMFBY)"
    name_hi: "प्रधानमंत्री फसल बीमा योजना"
    short_name: "PMFBY"
    level: "central"
    ministry_or_dept: "Ministry of Agriculture & Farmers Welfare"
    category: "Agriculture & Rural"
    description_en: "Comprehensive crop insurance scheme protecting farmers against non-preventable natural risks from pre-sowing to post-harvest."
    description_hi: "बुवाई से लेकर कटाई के बाद तक के प्राकृतिक जोखिमों से किसानों को सुरक्षा प्रदान करने वाली व्यापक फसल बीमा योजना।"
    initial_mode: "rag_only"
    rule_scope: "rag_only"
    rag_enabled: true
    rules_enabled: false
    official_portal_url: "https://pmfby.gov.in"
    benefits_summary_en: "Subsidized crop insurance with low premium rates (1.5% - 5%) covering yield loss and localized calamities."
    benefits_summary_hi: "कम प्रीमियम दरों (1.5% - 5%) पर फसल उपज हानि और स्थानीय आपदाओं हेतु अनुदानित फसल बीमा।"

  - scheme_id: "SCHEME-KCC"
    code: "kcc"
    name_en: "Kisan Credit Card (KCC)"
    name_hi: "किसान क्रेडिट कार्ड"
    short_name: "KCC"
    level: "central"
    ministry_or_dept: "Ministry of Agriculture & Farmers Welfare / RBI / NABARD"
    category: "Agriculture & Credit"
    description_en: "Credit scheme providing timely short-term credit to farmers for agricultural inputs, crop production, and allied activities."
    description_hi: "कृषि आदानों, फसल उत्पादन और संबद्ध गतिविधियों हेतु किसानों को समय पर अल्पकालिक ऋण सुविधा।"
    initial_mode: "rag_only"
    rule_scope: "rag_only"
    rag_enabled: true
    rules_enabled: false
    official_portal_url: "https://myscheme.gov.in/schemes/kcc"
    benefits_summary_en: "Subsidized interest rate at 4% with prompt repayment incentive for credit up to Rs. 3 Lakhs."
    benefits_summary_hi: "समय पर पुनर्भुगतान पर 4% की रियायती ब्याज दर पर 3 लाख रुपये तक का संस्थागत ऋण।"

  - scheme_id: "SCHEME-PMAY-G"
    code: "pmay_g"
    name_en: "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)"
    name_hi: "प्रधानमंत्री आवास योजना - ग्रामीण"
    short_name: "PMAY-G"
    level: "central"
    ministry_or_dept: "Ministry of Rural Development"
    category: "Housing & Welfare"
    description_en: "Housing initiative aimed at providing pucca houses with basic amenities to houseless and kutcha-house living rural families."
    description_hi: "ग्रामीण क्षेत्रों के बेघर और कच्चे घरों में रहने वाले परिवारों को पक्का मकान और बुनियादी सुविधाएं प्रदान करने की योजना।"
    initial_mode: "rag_only"
    rule_scope: "rag_only"
    rag_enabled: true
    rules_enabled: false
    official_portal_url: "https://pmayg.nic.in"
    benefits_summary_en: "Financial assistance of Rs. 1.20 Lakh in plains and Rs. 1.30 Lakh in hilly/difficult areas plus 90-95 days MGNREGA wages."
    benefits_summary_hi: "मैदानी क्षेत्रों में 1.20 लाख रुपये तथा पहाड़ी क्षेत्रों में 1.30 लाख रुपये की वित्तीय सहायता एवं मनरेगा मजदूरी।"

  - scheme_id: "SCHEME-PM-JAY"
