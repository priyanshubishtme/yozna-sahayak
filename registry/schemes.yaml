    description_hi: "ग्रामीण व वंचित परिवारों की महिलाओं को धुआं-मुक्त स्वच्छ रसोई ईंधन (एलपीजी कनेक्शन) उपलब्ध कराने की योजना।"
    initial_mode: "rag_only"
    rule_scope: "rag_only"
    rag_enabled: true
    rules_enabled: false
    official_portal_url: "https://www.pmuy.gov.in"
