    name_hi: "आयुष्मान भारत - प्रधानमंत्री जन आरोग्य योजना"
    short_name: "PM-JAY"
    level: "central"
    ministry_or_dept: "National Health Authority / MoHFW"
    category: "Healthcare"
    description_en: "World's largest government-funded health assurance scheme providing cashless secondary and tertiary inpatient care."
    description_hi: "विश्व की सबसे बड़ी स्वास्थ्य आश्वासन योजना, माध्यमिक और तृतीयक अस्पताल देखभाल हेतु कैशलेस सुविधा।"
    initial_mode: "rag_only"
    rule_scope: "rag_only"
    rag_enabled: true
    rules_enabled: false
    official_portal_url: "https://pmjay.gov.in"
    benefits_summary_en: "Health cover of Rs. 5 Lakh per family per year for secondary and tertiary care hospitalization across impaneled hospitals."
    benefits_summary_hi: "प्रति परिवार प्रति वर्ष 5 लाख रुपये तक का कैशलेस स्वास्थ्य सुरक्षा कवर।"

  - scheme_id: "SCHEME-PMUY"
